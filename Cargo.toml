[package]
name = "litepen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "轻笔 · LitePen — one Markdown in, one letter-like HTML out. 单二进制 CLI，把一份 Markdown 渲染成一封像信一样好看的静态页面。"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "html", "letter", "static", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
